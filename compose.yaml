services:
  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    networks:
      - app-network

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ../.env
    expose:
      - "3001"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app-network
      - database-network

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - database-network

volumes:
  postgres_data:

networks:
  app-network:
  database-network:
    internal: true
